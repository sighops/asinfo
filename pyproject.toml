[project]
name = "ipasn"
version = "0.9.0"
description = "Tools for looking up ASN from IP, and information about ASNs such as name, announced prefixes, etc."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pytricia>=1.2.0",
]

[project.scripts]
ipasn = "ipasn.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[build-system]
requires = ["uv_build >= 0.8.17, <0.9.0"]
build-backend = "uv_build"
